name: React CI/CD

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main

# Define permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'  # Cache npm dependencies for faster builds

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: npm ci  # Use npm ci for faster, reliable installs in CI

      # Step 4: Build the React application
      - name: Build React App
        run: npm run build

      # Step 5: Verify build success by checking if dist folder exists
      - name: Verify Build Success
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory created"

      # Step 6: Setup Pages for deployment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 7: Upload build artifacts for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # Upload the built app from dist folder

  # Job 2: Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build  # Wait for build job to complete
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4